[package]
name = "chrysalide"
version = "0.1.0"
edition = "2024"
description = "Atelier de morphing hors ligne"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:gtk", "tauri/custom-protocol"]

[[bin]]
name = "chrysalide"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
